[package]
name = "ax"
version = "0.1.1"
edition = "2024"

# Not `as`: that is both a Rust keyword and the system assembler at /usr/bin/as,
# which shadowing on PATH would break C and Rust builds.
[lib]
name = "ax"
path = "src/lib.rs"

[[bin]]
name = "ax"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
libc = "0.2.189"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "charset", "http2"] }
rquickjs = { version = "0.12.2", features = ["full-async"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
