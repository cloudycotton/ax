[package]
name = "as-agent"
version = "0.1.0"
edition = "2024"

# The binary is `agent`, not `as`: `as` is both a Rust keyword and the system
# assembler at /usr/bin/as, which shadowing would break C and Rust builds.
[lib]
name = "as_agent"
path = "src/lib.rs"

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
libc = "0.2.189"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "charset", "http2"] }
rquickjs = { version = "0.12.2", features = ["full-async"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
